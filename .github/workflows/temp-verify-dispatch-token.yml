# TEMPORARY diagnostic — delete after use.
#
# Verifies that the NEURODESKEDU_DISPATCH_TOKEN secret can create a
# repository_dispatch event on neurodesk/neurodeskedu. The production senders
# wrap this call in try/catch + core.warning, so a 403 leaves the job green and
# the failure is invisible. This job deliberately does NOT catch the error, so
# the result is unambiguous.
#
# Touches nothing else: no issue comments, no label changes.

name: TEMP verify dispatch token

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reviews-updated to neurodesk/neurodeskedu
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NEURODESKEDU_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'neurodesk',
              repo: 'neurodeskedu',
              event_type: 'reviews-updated',
            });
            core.info('OK — dispatch accepted (204). Token has Contents: write on neurodesk/neurodeskedu.');
